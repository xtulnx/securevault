name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release version before building
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=()
          if [[ "$REF_TYPE" == tag ]]; then
            args=(--tag "$RELEASE_TAG")
          fi
          version=$(python scripts/release.py version "${args[@]}")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Test release tooling
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/server/target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"
      - name: Test
        run: cargo test --locked --manifest-path server/Cargo.toml --target "${{ matrix.target }}"
      - name: Build release
        run: cargo build --locked --release --manifest-path server/Cargo.toml --target "${{ matrix.target }}"
      - name: Smoke test release binary
        run: |
          binary="server/target/${{ matrix.target }}/release/securevault"
          "$binary" --help
          python scripts/smoke_release.py --binary "$binary"
      - name: Package
        run: python scripts/release.py package --target "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: securevault-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: securevault-*
          merge-multiple: true
          path: dist
      - name: Verify all four platform assets and generate checksums
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/release.py checksums --version "$RELEASE_VERSION"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          assets=(*.tar.gz SHA256SUMS)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            prerelease=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --generate-notes "${prerelease[@]}"
          fi
